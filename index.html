<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Count the Groups!</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
      background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 16px 40px;
    }

    h1 {
      font-size: 2.2rem;
      color: #d63031;
      text-shadow: 2px 2px 0 #fff;
      margin-bottom: 4px;
      text-align: center;
    }

    /* ── Zone strip ── */
    #zone-strip {
      display: flex;
      gap: 5px;
      margin: 10px 0 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .zone-pip {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: #dfe6e9;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #636e72;
      border: 2px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }

    .zone-pip.done     { background: #55efc4; color: #00b894; }
    .zone-pip.active   { border-color: #6c5ce7; background: #e8e4ff; color: #6c5ce7; transform: scale(1.2); }

    /* ── Zone header ── */
    #zone-header {
      font-size: 1rem;
      color: #636e72;
      margin-bottom: 12px;
      text-align: center;
    }

    #zone-header strong { color: #2d3436; }

    /* ── Stars ── */
    #stars-bar {
      font-size: 1.2rem;
      margin-bottom: 12px;
      color: #e17055;
    }

    /* ── Game card ── */
    #game-card {
      background: white;
      border-radius: 24px;
      padding: 24px 28px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13);
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    #equation {
      font-size: 3rem;
      font-weight: bold;
      color: #6c5ce7;
      letter-spacing: 4px;
      text-shadow: 2px 2px 0 #dfe6e9;
      margin-bottom: 6px;
    }

    #question-text {
      font-size: 1.1rem;
      color: #636e72;
      margin-bottom: 16px;
      line-height: 1.5;
    }

    /* ── Hint section ── */
    #hint-section { margin-bottom: 18px; }

    #hint-btn {
      padding: 10px 24px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: bold;
      background: #f0f0ff;
      border: 2px dashed #a29bfe;
      border-radius: 30px;
      cursor: pointer;
      color: #6c5ce7;
      transition: transform 0.15s, background 0.15s;
    }

    #hint-btn:hover { transform: scale(1.06); background: #e8e4ff; }
    #hint-btn:disabled { opacity: 0.4; cursor: default; transform: none; }

    #groups-container {
      display: none; /* hidden until hint clicked */
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-top: 14px;
    }

    #groups-container.visible { display: flex; }

    .group-box {
      background: #f0f4ff;
      border: 3px solid #74b9ff;
      border-radius: 14px;
      padding: 9px 12px;
      min-width: 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      animation: popIn 0.25s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.5); opacity: 0; }
      to   { transform: scale(1);   opacity: 1; }
    }

    .group-label {
      font-size: 0.65rem;
      color: #636e72;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .group-items {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 2px;
      font-size: 1.5rem;
      line-height: 1;
    }

    /* ── Answer buttons ── */
    #answer-section { margin-bottom: 16px; }

    #answer-section > p {
      font-size: 1rem;
      color: #636e72;
      margin-bottom: 10px;
    }

    #answer-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .answer-btn {
      width: 66px;
      height: 66px;
      font-size: 1.5rem;
      font-family: inherit;
      font-weight: bold;
      border: 3px solid #dfe6e9;
      border-radius: 50%;
      background: #f9f9f9;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .answer-btn:hover { transform: scale(1.15); background: #dfe6e9; }

    .answer-btn.correct {
      background: #55efc4; border-color: #00b894;
      animation: bounce 0.4s ease;
    }

    .answer-btn.wrong {
      background: #ff7675; border-color: #d63031;
      animation: shake 0.4s ease;
    }

    @keyframes bounce {
      0%,100% { transform: scale(1); }
      50%      { transform: scale(1.3); }
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25%      { transform: translateX(-8px); }
      75%      { transform: translateX(8px); }
    }

    #feedback {
      font-size: 1.3rem;
      min-height: 34px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    #feedback.good { color: #00b894; }
    #feedback.bad  { color: #d63031; }

    /* zone-complete toast */
    #zone-toast {
      display: none;
      font-size: 1.05rem;
      font-weight: bold;
      color: #6c5ce7;
      margin-bottom: 6px;
      animation: fadeSlide 0.4s ease;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    #next-btn {
      display: none;
      margin: 8px auto 0;
      padding: 12px 32px;
      font-size: 1.15rem;
      font-family: inherit;
      font-weight: bold;
      background: #fdcb6e;
      border: 3px solid #e17055;
      border-radius: 40px;
      cursor: pointer;
      transition: transform 0.15s;
    }

    #next-btn:hover { transform: scale(1.08); }

    /* ── Zone complete screen ── */
    #zone-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      text-align: center;
    }

    #zone-screen .big-emoji { font-size: 3.5rem; animation: spin 1s ease infinite alternate; }

    @keyframes spin {
      from { transform: rotate(-10deg) scale(1); }
      to   { transform: rotate(10deg) scale(1.2); }
    }

    #zone-screen h2 { font-size: 1.8rem; color: #d63031; text-shadow: 1px 1px 0 #fff; }
    #zone-screen p  { font-size: 1rem; color: #636e72; }

    #next-zone-btn {
      padding: 13px 32px;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: bold;
      background: #74b9ff;
      border: 3px solid #0984e3;
      border-radius: 40px;
      cursor: pointer;
      color: white;
      transition: transform 0.15s;
    }

    #next-zone-btn:hover { transform: scale(1.08); }

    /* ── Win screen ── */
    #win-screen {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    #win-screen .big-emoji { font-size: 4rem; animation: spin 1s ease infinite alternate; }
    #win-screen h2 { font-size: 2rem; color: #d63031; text-shadow: 2px 2px 0 #fff; }
    #win-screen p  { font-size: 1.05rem; color: #636e72; }

    #play-again-btn {
      padding: 13px 34px;
      font-size: 1.1rem;
      font-family: inherit;
      font-weight: bold;
      background: #55efc4;
      border: 3px solid #00b894;
      border-radius: 40px;
      cursor: pointer;
      color: #00664d;
      transition: transform 0.15s;
    }

    #play-again-btn:hover { transform: scale(1.08); }

    /* ── Mobile ── */
    @media (max-width: 480px) {
      body { padding: 12px 10px 32px; }
      h1 { font-size: 1.6rem; }
      #game-card { padding: 18px 14px; border-radius: 18px; }
      #equation { font-size: 2.2rem; letter-spacing: 2px; }
      #question-text { font-size: 0.95rem; }
      .answer-btn { width: 58px; height: 58px; font-size: 1.3rem; }
      #answer-buttons { gap: 10px; }
      .group-items { font-size: 1.25rem; }
      .zone-pip { width: 22px; height: 22px; font-size: 0.6rem; }
    }
  </style>
</head>
<body>

  <h1>🍎 Count the Groups!</h1>
  <div id="stars-bar">⭐ <span id="star-count">0</span> stars</div>

  <!-- Zone progress pips -->
  <div id="zone-strip"></div>
  <div id="zone-header"></div>

  <div id="game-card">

    <!-- Game view -->
    <div id="game-view">
      <div id="equation"></div>
      <div id="question-text"></div>

      <!-- Hint section -->
      <div id="hint-section">
        <button id="hint-btn">🤔 I don't know</button>
        <div id="groups-container"></div>
      </div>

      <!-- Answer buttons -->
      <div id="answer-section">
        <p>Pick the answer 👇</p>
        <div id="answer-buttons"></div>
      </div>

      <div id="zone-toast"></div>
      <div id="feedback"></div>
      <button id="next-btn">Next ➡️</button>
    </div>

    <!-- Zone complete screen -->
    <div id="zone-screen">
      <div class="big-emoji" id="zone-emoji"></div>
      <h2 id="zone-title"></h2>
      <p id="zone-message"></p>
      <button id="next-zone-btn">Next Zone ➡️</button>
    </div>

    <!-- All done! Win screen -->
    <div id="win-screen">
      <div class="big-emoji">🏆</div>
      <h2>You finished all 10 zones!</h2>
      <p id="win-message"></p>
      <button id="play-again-btn">Play Again 🎉</button>
    </div>

  </div>

  <script>
    // ═══════════════════════════════════════════════════════════════
    // SOUND  (Web Audio API)
    // ═══════════════════════════════════════════════════════════════
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    function getCtx() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }

    function playTone(freq, type, dur, vol = 0.28, delay = 0) {
      const ctx = getCtx();
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = type;
      o.frequency.setValueAtTime(freq, ctx.currentTime + delay);
      g.gain.setValueAtTime(vol, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + dur);
      o.start(ctx.currentTime + delay);
      o.stop(ctx.currentTime + delay + dur);
    }

    const soundCorrect = () => { playTone(520,'sine',0.12,0.25,0); playTone(660,'sine',0.12,0.25,0.12); playTone(800,'sine',0.18,0.25,0.24); };
    const soundWrong   = () => { playTone(220,'sawtooth',0.18,0.2,0); playTone(160,'sawtooth',0.18,0.15,0.16); };
    const soundHint    = () => { playTone(440,'sine',0.1,0.15,0); playTone(350,'sine',0.15,0.1,0.1); };
    const soundZone    = () => [330,415,494,587,698,880].forEach((f,i) => playTone(f,'triangle',0.18,0.26,i*0.09));
    const soundWin     = () => [523,659,784,1047,784,880,1047].forEach((f,i) => playTone(f,'sine',0.22,0.28,i*0.12));

    // ═══════════════════════════════════════════════════════════════
    // ZONES  — 10 zones × 10 questions each (strictly ascending)
    //
    // Each question: { a, b }  where answer = a × b
    // Zone 1:  all ×1 (trivial — counting single groups)
    // Zone 2:  ×2 small
    // Zone 3:  ×2 larger / ×3 small
    // Zone 4:  ×3 medium
    // Zone 5:  ×4 small-medium
    // Zone 6:  ×4-5 medium
    // Zone 7:  ×5-6
    // Zone 8:  ×6-7
    // Zone 9:  ×7-9
    // Zone 10: ×8-10 (full range)
    // ═══════════════════════════════════════════════════════════════
    const ZONES = [
      { name: 'Zone 1 – Baby Steps 🐣',   emoji: '🐣', color: '#b2f5c8',
        questions: [{a:1,b:1},{a:1,b:2},{a:2,b:1},{a:1,b:3},{a:3,b:1}] },

      { name: 'Zone 2 – Doubles 🐰',       emoji: '🐰', color: '#b2eaff',
        questions: [{a:2,b:2},{a:2,b:3},{a:3,b:2},{a:2,b:4},{a:4,b:2}] },

      { name: 'Zone 3 – Threes 🌟',        emoji: '🌟', color: '#fff3b2',
        questions: [{a:3,b:3},{a:3,b:4},{a:4,b:3},{a:3,b:5},{a:5,b:3}] },

      { name: 'Zone 4 – Fours 🍀',         emoji: '🍀', color: '#c3f5b2',
        questions: [{a:4,b:4},{a:4,b:5},{a:5,b:4},{a:4,b:6},{a:6,b:4}] },

      { name: 'Zone 5 – High Fives ✋',    emoji: '✋', color: '#ffd6b2',
        questions: [{a:5,b:5},{a:5,b:6},{a:6,b:5},{a:5,b:7},{a:7,b:5}] },

      { name: 'Zone 6 – Six Pack 🎲',      emoji: '🎲', color: '#f5b2e8',
        questions: [{a:6,b:6},{a:6,b:7},{a:7,b:6},{a:6,b:8},{a:8,b:6}] },

      { name: 'Zone 7 – Lucky Sevens 🎯',  emoji: '🎯', color: '#e8d5ff',
        questions: [{a:7,b:7},{a:7,b:8},{a:8,b:7},{a:7,b:9},{a:9,b:7}] },

      { name: 'Zone 8 – Power Eight 💥',   emoji: '💥', color: '#ffc8c8',
        questions: [{a:8,b:8},{a:8,b:9},{a:9,b:8},{a:8,b:10},{a:10,b:8}] },

      { name: 'Zone 9 – Almost There 🚀',  emoji: '🚀', color: '#c8d8ff',
        questions: [{a:9,b:9},{a:9,b:10},{a:10,b:9},{a:7,b:10},{a:10,b:7}] },

      { name: 'Zone 10 – Champion! 🏆',    emoji: '🏆', color: '#ffe9a0',
        questions: [{a:10,b:10},{a:9,b:9},{a:8,b:8},{a:7,b:7},{a:6,b:9}] },
    ];

    const EMOJIS = ['🍎','🐟','⭐','🍓','🌸','🐥','🍕','🎈','🦋','🍦','🚂','🦊','🎀','🍩','🌈'];

    // ═══════════════════════════════════════════════════════════════
    // HELPERS
    // ═══════════════════════════════════════════════════════════════
    function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function buildChoices(correct) {
      const set = new Set([correct]);
      let tries = 0;
      while (set.size < 4 && tries < 400) {
        const spread = Math.max(4, Math.floor(correct * 0.35));
        const c = correct + randInt(-spread, spread);
        if (c > 0 && c !== correct) set.add(c);
        tries++;
      }
      for (let n = 1; set.size < 4; n++) if (n !== correct) set.add(n);
      return shuffle([...set]);
    }

    // ═══════════════════════════════════════════════════════════════
    // STATE
    // ═══════════════════════════════════════════════════════════════
    let zoneIdx      = 0;   // 0–9
    let qIdx         = 0;   // 0–9 within zone
    let totalStars   = 0;
    let zoneStars    = 0;
    let currentAnswer= 0;
    let answered     = false;
    let hintUsed     = false;

    // ═══════════════════════════════════════════════════════════════
    // DOM REFS
    // ═══════════════════════════════════════════════════════════════
    const $  = id => document.getElementById(id);
    const equationEl     = $('equation');
    const questionText   = $('question-text');
    const hintBtn        = $('hint-btn');
    const groupsContainer= $('groups-container');
    const answerButtons  = $('answer-buttons');
    const feedback       = $('feedback');
    const zoneToast      = $('zone-toast');
    const nextBtn        = $('next-btn');
    const starCount      = $('star-count');
    const zoneHeader     = $('zone-header');
    const zoneStrip      = $('zone-strip');
    const gameView       = $('game-view');
    const zoneScreen     = $('zone-screen');
    const winScreen      = $('win-screen');

    // ═══════════════════════════════════════════════════════════════
    // ZONE STRIP  (10 pips)
    // ═══════════════════════════════════════════════════════════════
    function buildStrip() {
      zoneStrip.innerHTML = '';
      ZONES.forEach((z, i) => {
        const pip = document.createElement('div');
        pip.className = 'zone-pip' + (i < zoneIdx ? ' done' : i === zoneIdx ? ' active' : '');
        pip.textContent = i + 1;
        pip.title = z.name;
        zoneStrip.appendChild(pip);
      });
    }

    function updateHeader() {
      const z = ZONES[zoneIdx];
      zoneHeader.innerHTML = `<strong>${z.name}</strong> &nbsp;·&nbsp; Question ${qIdx + 1} / 5`;
    }

    // ═══════════════════════════════════════════════════════════════
    // RENDER QUESTION
    // ═══════════════════════════════════════════════════════════════
    function renderQuestion() {
      const zone = ZONES[zoneIdx];
      const { a, b } = zone.questions[qIdx];
      const emoji = EMOJIS[randInt(0, EMOJIS.length - 1)];
      currentAnswer = a * b;
      answered  = false;
      hintUsed  = false;

      equationEl.textContent = `${a} × ${b} = ?`;

      const groupWord = a === 1 ? 'group' : 'groups';
      questionText.innerHTML =
        `<strong>${a}</strong> ${groupWord} of <strong>${b} ${emoji}</strong> each`;

      // Build groups (hidden until hint)
      groupsContainer.innerHTML = '';
      groupsContainer.classList.remove('visible');
      for (let g = 0; g < a; g++) {
        const box   = document.createElement('div');  box.className = 'group-box';
        const lbl   = document.createElement('div');  lbl.className = 'group-label'; lbl.textContent = `Group ${g+1}`;
        const items = document.createElement('div');  items.className = 'group-items'; items.textContent = emoji.repeat(b);
        box.appendChild(lbl); box.appendChild(items);
        groupsContainer.appendChild(box);
      }

      // Hint button
      hintBtn.disabled = false;
      hintBtn.textContent = '🤔 I don\'t know';

      // Answer buttons
      answerButtons.innerHTML = '';
      buildChoices(currentAnswer).forEach(num => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.textContent = num;
        btn.addEventListener('click', () => handleAnswer(btn, num));
        answerButtons.appendChild(btn);
      });

      feedback.textContent = '';
      feedback.className   = '';
      zoneToast.style.display = 'none';
      nextBtn.style.display   = 'none';

      buildStrip();
      updateHeader();
    }

    // ═══════════════════════════════════════════════════════════════
    // HINT
    // ═══════════════════════════════════════════════════════════════
    hintBtn.addEventListener('click', () => {
      if (answered) return;
      hintUsed = true;
      groupsContainer.classList.add('visible');
      hintBtn.disabled    = true;
      hintBtn.textContent = '👀 Count the groups, then try again!';
      soundHint();
      // Disable current answer buttons — she must answer after seeing the hint
      // but this attempt won't count toward the 5. Show a soft note.
      feedback.textContent = "Take a look, then pick your answer! (won't count as a star 😊)";
      feedback.className   = 'bad';
    });

    // ═══════════════════════════════════════════════════════════════
    // ANSWER
    // ═══════════════════════════════════════════════════════════════
    function handleAnswer(btn, chosen) {
      if (answered) return;
      answered = true;

      document.querySelectorAll('.answer-btn').forEach(b => b.style.pointerEvents = 'none');

      if (chosen === currentAnswer) {
        btn.classList.add('correct');
        soundCorrect();
        if (hintUsed) {
          // Correct but used hint — show groups, then retry with a fresh question
          feedback.textContent = "Well done! But let's try one without the hint 💪";
          feedback.className   = 'good';
          nextBtn.textContent  = 'Try another ➡️';
          nextBtn.dataset.retry = '1';
        } else {
          const praise = ['Great job! 🎉','Awesome! ⭐','You got it! 🌟','Brilliant! 🏆','Super! 🌈','Nice one! 👏'][randInt(0,5)];
          feedback.textContent = praise;
          feedback.className   = 'good';
          totalStars++; zoneStars++;
          starCount.textContent = totalStars;
          nextBtn.textContent   = 'Next ➡️';
          delete nextBtn.dataset.retry;
        }
      } else {
        btn.classList.add('wrong');
        // reveal correct answer
        document.querySelectorAll('.answer-btn').forEach(b => {
          if (+b.textContent === currentAnswer) b.classList.add('correct');
        });
        groupsContainer.classList.add('visible');
        soundWrong();
        if (hintUsed) {
          feedback.textContent = `Not quite — it's ${currentAnswer}. Let's try a new one! 😊`;
        } else {
          feedback.textContent = `Not quite — it's ${currentAnswer} 😊`;
        }
        feedback.className  = 'bad';
        nextBtn.textContent = hintUsed ? 'Try another ➡️' : 'Next ➡️';
        nextBtn.dataset.retry = hintUsed ? '1' : '';
      }

      nextBtn.style.display = 'inline-block';
    }

    // ═══════════════════════════════════════════════════════════════
    // NEXT BUTTON
    // ═══════════════════════════════════════════════════════════════
    nextBtn.addEventListener('click', () => {
      if (nextBtn.dataset.retry === '1') {
        // Hint was used — don't advance qIdx, re-render the same question fresh
        // (same a×b but hint is hidden again, so she has to try on her own)
        renderQuestion();
      } else {
        qIdx++;
        if (qIdx >= 5) {
          showZoneComplete();
        } else {
          renderQuestion();
        }
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // ZONE COMPLETE SCREEN
    // ═══════════════════════════════════════════════════════════════
    function showZoneComplete() {
      soundZone();
      gameView.style.display      = 'none';
      zoneScreen.style.display    = 'flex';

      const zone = ZONES[zoneIdx];
      $('zone-emoji').textContent = zone.emoji;
      $('zone-title').textContent = `${zone.name.split('–')[0].trim()} complete!`;

      const pct = Math.round((zoneStars / 5) * 100);
      let msg = `You scored ${zoneStars} / 5 stars in this zone. `;
      if (zoneStars === 10) msg += 'Perfect! 🌈';
      else if (pct >= 70)   msg += 'Really well done! 🌟';
      else                  msg += 'Keep going — you\'re learning! 💪';
      $('zone-message').textContent = msg;

      const isLast = zoneIdx >= ZONES.length - 1;
      $('next-zone-btn').textContent = isLast ? 'See Results 🏆' : 'Next Zone ➡️';
    }

    $('next-zone-btn').addEventListener('click', () => {
      zoneIdx++;
      zoneStars = 0;
      if (zoneIdx >= ZONES.length) {
        showWinScreen();
      } else {
        qIdx = 0;
        zoneScreen.style.display = 'none';
        gameView.style.display   = 'block';
        renderQuestion();
      }
    });

    // ═══════════════════════════════════════════════════════════════
    // WIN SCREEN
    // ═══════════════════════════════════════════════════════════════
    function showWinScreen() {
      soundWin();
      zoneScreen.style.display = 'none';
      winScreen.style.display  = 'flex';
      const total = ZONES.length * 5;
      const pct   = Math.round((totalStars / total) * 100);
      let msg = `You got ${totalStars} out of ${total} stars across all 10 zones! `;
      if (pct === 100)    msg += '🌈 Perfect score — you\'re a superstar!';
      else if (pct >= 80) msg += '🌟 Amazing work!';
      else if (pct >= 60) msg += '💪 Great effort — keep practising!';
      else                msg += '😊 Well done for finishing — play again to improve!';
      $('win-message').textContent = msg;
    }

    $('play-again-btn').addEventListener('click', () => {
      zoneIdx    = 0; qIdx = 0;
      totalStars = 0; zoneStars = 0;
      starCount.textContent = 0;
      winScreen.style.display  = 'none';
      gameView.style.display   = 'block';
      renderQuestion();
    });

    // ═══════════════════════════════════════════════════════════════
    // START
    // ═══════════════════════════════════════════════════════════════
    renderQuestion();
  </script>
</body>
</html>
